<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242834">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AfroDesk</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-Bold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-BoldItalic.ttf) format('truetype');font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-ExtraBold.ttf) format('truetype');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-ExtraBoldItalic.ttf) format('truetype');font-weight:800;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-ExtraLight.ttf) format('truetype');font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-ExtraLightItalic.ttf) format('truetype');font-weight:200;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-Italic.ttf) format('truetype');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-Light.ttf) format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-LightItalic.ttf) format('truetype');font-weight:300;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-Medium.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-MediumItalic.ttf) format('truetype');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-Regular.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-SemiBold.ttf) format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/PlusJakartaSans-SemiBoldItalic.ttf) format('truetype');font-weight:600;font-style:italic;font-display:swap}
:root{--bg:#171a24;--pn:#242834;--tx:#ECEBF5;--mu:#8e93a8;--bd:#363b4f;--p:#7D53FF;--a:#FF5400;--sf:'Plus Jakarta Sans',system-ui,sans-serif}
[data-theme=light]{--bg:#F7F2EA;--pn:#fff;--tx:#242834;--mu:#6f7385;--bd:#e3dccf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sf);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--p)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{position:relative;display:flex;align-items:center;gap:10px;padding:14px;min-height:80px;flex:none}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--p),var(--a))}
#brand{display:flex;align-items:center;gap:11px;border:0;padding:0;letter-spacing:.18em;font-size:18px;font-weight:600}
#brand img{width:46px;height:46px;border-radius:11px}
.sp{flex:1}#sv{font-size:11px;color:var(--mu)}
.pill{padding:6px 12px;font-size:13px}.pill.on{background:var(--p);border-color:var(--p);color:#fff}
.v{display:none;flex:1;min-height:0;flex-direction:column}.v.on{display:flex}
/* splash */
#sp{position:fixed;inset:0;z-index:50;background:#F7F2EA;color:#242834;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .35s}
#sp.out{opacity:0}
#sp img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 44px rgba(125,83,255,.45);animation:zm 2s ease-in-out both}
@keyframes zm{0%{transform:scale(.7);opacity:0}35%{transform:scale(1.08);opacity:1}60%{transform:scale(.97)}100%{transform:scale(1.03)}}
#sp h1{font-weight:300;font-size:30px;letter-spacing:.3em;margin:12px 0 0;padding-left:.3em;animation:fi .8s .3s both}
#sp p{margin:0;animation:fi .8s .5s both}#sp .dv{font-size:12px;color:#6f7385;animation-delay:.7s}
#sp .ft{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.25em;color:#8a8ea0;animation:fi .8s .9s both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* launch */
#lc{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px;max-width:640px;width:100%;margin:0 auto}
#lc h2{font-family:var(--sf);font-weight:400;font-size:26px;line-height:1.25;margin:0}
#lc h2 span{color:var(--mu);display:block;font-size:19px}
.mc{text-align:left;padding:18px;border-radius:14px;background:var(--pn);border-top:3px solid var(--p);display:block;width:100%}
.mc.d{border-top-color:var(--a)}.mc b{font-size:17px}.mc small{display:block;color:var(--mu);margin-top:4px;font-size:13px}
.cnt{color:var(--mu);font-size:12px}
/* notes */
#tabs{display:flex;gap:4px;padding:6px 12px 0;overflow-x:auto;flex:none}
.tab{border-radius:8px 8px 0 0;border-bottom:0;padding:5px 12px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
.tab.on{background:var(--pn);color:var(--tx);border-color:var(--bd)}
#tb{display:flex;gap:6px;align-items:center;padding:6px 12px;overflow-x:auto;flex:none;background:var(--pn);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
#tb button{padding:4px 10px;flex:none}
#ed{flex:1;min-height:0;overflow:auto;padding:14px 12px 30px}
.pg{max-width:720px;margin:0 auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;min-height:100%}
#nt{width:100%;background:none;border:0;border-bottom:2px solid var(--a);color:var(--tx);font:700 24px var(--sf);padding:2px 0 8px;margin-bottom:12px}
#nb{width:100%;min-height:55vh;background:none;border:0;resize:none;color:var(--tx);font:17px/1.7 var(--sf);display:block}
#nb::placeholder,#nt::placeholder{color:var(--mu)}
#pv{display:none;font:17px/1.7 var(--sf)}#pv h1,#pv h2,#pv h3{margin:.6em 0 .2em}#pv p{margin:.4em 0}#pv code{background:var(--bg);padding:1px 5px;border-radius:4px}#pv a{color:var(--p)}
.li{display:flex;gap:10px;align-items:flex-start;margin:.25em 0}.rd,.sq{flex:none;width:7px;height:7px;background:var(--tx);margin:.62em 4px 0}.rd{border-radius:50%}.bx{flex:none;width:16px;height:16px;border:2px solid var(--p);border-radius:4px;margin-top:.28em;position:relative}.bx.on{background:var(--p)}.bx.on:after{content:'';position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.prev #nb{display:none}.prev #pv{display:block}
/* desk */
#cv{flex:1;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--bd) 1.3px,transparent 1.3px)}
#wd{position:absolute;left:0;top:0;transform-origin:0 0}
#lk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#lk line{stroke:var(--p);stroke-width:2.5;stroke-linecap:round}
.card{position:absolute;width:180px;background:var(--pn);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card.sel{outline:2px solid var(--c);outline-offset:2px}
.ch{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;cursor:grab;font-size:10px;letter-spacing:.15em;color:var(--mu)}
.ch span{flex:1}.ch button{border:0;padding:2px 6px;font-size:12px;color:var(--c)}.ch button+button{color:var(--mu)}
.card textarea{width:100%;height:80px;resize:vertical;background:none;border:0;color:var(--tx);font:14px/1.4 var(--sf);padding:2px 8px 8px;display:block}
.cn{padding:0 8px 8px;font-size:13px;max-height:140px;overflow:hidden;cursor:pointer}.cn h4{margin:0 0 3px;font-size:14px}.cn p{margin:2px 0}
#dt{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:96vw;overflow-x:auto}
#dt button{border:0;flex:none;padding:6px 10px}#dt button.on{background:var(--a);color:#fff}
/* sheet + toast */
#sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}#sh div{background:var(--pn);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#sh h3{margin:0 0 4px;font-size:14px;color:var(--mu);font-weight:500}#sh button{text-align:left;padding:11px 12px}
#ts{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--p);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}#ts.on{opacity:1}
input,textarea,select,code{font-family:inherit}
#th{width:40px;height:36px;padding:0;display:grid;place-items:center;color:var(--tx)}
[data-theme=dark] #th{color:#fff}
#th svg,#tb svg,#lm svg{width:18px;height:18px;display:block}
#tb button{min-width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 9px}
#lm{position:fixed;z-index:30;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:180px}
#lm[hidden]{display:none}
#lm button{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;padding:9px 10px}
#lm button:hover{background:var(--bg)}
@media(max-width:440px){#sv{display:none}}
@media(max-width:400px){#brand{font-size:15px;letter-spacing:.12em;gap:8px}#brand img{width:42px;height:42px}.pill{padding:6px 8px}header{gap:6px;padding:14px 10px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="sp">
  <img src="logo.png" alt="AfroDesk logo">
  <h1>AFRODESK</h1>
  <p>Capture Inspiration. Structure Ideas. Find Clarity.</p>
  <p class="dv">Developed by Last Dulani</p>
  <div class="ft">IDEA · ORDER · MOMENTUM</div>
</div>

<div id="app">
  <header>
    <button id="brand" aria-label="Home"><img src="logo.png" alt=""><span>AFRODESK</span></button>
    <span class="sp"></span><span id="sv">Saved</span>
    <button class="pill" data-go="notes">Notes</button>
    <button class="pill" data-go="desk">Desk</button>
    <button id="th" aria-label="Toggle theme"></button>
  </header>

  <section class="v on" id="v-launch"><div id="lc">
    <h2>Hi, welcome to AfroDesk.<span>What are you drafting today?</span></h2>
    <button class="mc" data-go="notes"><b>Notes</b><small>Fast, quiet capture. Markdown scratchpad for ideas, outlines, links and checklists.</small></button>
    <button class="mc d" data-go="desk"><b>Desk</b><small>An open canvas to pan, zoom and connect cards: mind maps, flows, storyboards.</small></button>
    <div class="cnt" id="cnt"></div>
  </div></section>

  <section class="v" id="v-notes">
    <div id="tabs"></div>
    <div id="tb">
      <button data-f="b" aria-label="Bold" title="Bold"><b>B</b></button><button data-f="i" aria-label="Italic" title="Italic"><i>I</i></button><button data-f="h" aria-label="Heading" title="Heading">H</button><button id="lb" aria-label="List" title="List" aria-haspopup="true" aria-expanded="false"></button><button data-f="k" aria-label="Link" title="Link"></button>
      <span class="sp"></span>
      <button id="pvb" aria-label="Preview" title="Preview"></button><button id="todesk" aria-label="Send to Desk" title="Send to Desk"></button><button id="more" aria-label="More" title="More"></button>
    </div>
    <div id="ed"><div class="pg" id="pg">
      <input id="nt" placeholder="Untitled" autocomplete="off">
      <textarea id="nb" placeholder="Start writing here. Everything saves on your device."></textarea>
      <div id="pv"></div>
    </div></div>
  </section>

  <section class="v" id="v-desk">
    <div id="cv">
      <div id="wd"><svg id="lk"></svg></div>
      <div id="dt">
        <button id="addc">+ Card</button><button id="addn">From note</button><button id="lkb">Link</button><button id="fit">Fit</button><button id="dex">Export</button>
      </div>
    </div>
  </section>
</div>
<div id="sh"><div id="shb"></div></div><div id="ts"></div>
<div id="lm" hidden><button data-f="l" data-ic="rd">Round bullets</button><button data-f="q" data-ic="sq">Square bullets</button><button data-f="c" data-ic="bx">Checkbox</button></div>
<input type="file" id="imp" accept=".json" hidden>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const COL=['#7D53FF','#FF5400','#2FB6A3','#E8B923','#8A93A8'];
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',rd:'<circle cx="12" cy="12" r="4.5" fill="currentColor"/>',sq:'<rect x="7.5" y="7.5" width="9" height="9" fill="currentColor"/>',bx:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',desk:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M11 7h4a2 2 0 0 1 2 2v4"/>',more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
[['#lb','list'],['[data-f=k]','link'],['#pvb','eye'],['#todesk','desk'],['#more','more']].forEach(([s,n])=>$(s).innerHTML=ic(n));
$$('#lm button').forEach(b=>b.insertAdjacentHTML('afterbegin',ic(b.dataset.ic)));
/* ---------- local database (IndexedDB) ---------- */
let _db;const DB={
 o(){return _db||(_db=new Promise((r,j)=>{const q=indexedDB.open('afrodesk',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=j}))},
 async get(k){const d=await this.o();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})},
 async set(k,v){const d=await this.o();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})}};
let S={notes:[],cards:[],links:[],V:{x:60,y:60,k:1},cur:null,theme:'dark'},selId=null,linkMode=false,linkFrom=null,tm;
const save=()=>{$('#sv').textContent='Saving…';clearTimeout(tm);tm=setTimeout(async()=>{try{await DB.set('s',S)}catch(e){}$('#sv').textContent='Saved'},350)};
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function sheet(title,items){$('#shb').innerHTML=`<h3>${title}</h3>`;items.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{$('#sh').classList.remove('on');f&&f()};$('#shb').appendChild(b)});$('#sh').classList.add('on')}
$('#sh').onclick=e=>{if(e.target.id=='sh')$('#sh').classList.remove('on')};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* ---------- markdown ---------- */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(t){let o='';(t||'').split('\n').forEach(l=>{let m;
 if(m=l.match(/^(#{1,3}) (.*)/))o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;
 else if(m=l.match(/^- \[( |x)\] (.*)/i))o+=`<div class=li><span class="bx${m[1]==' '?'':' on'}"></span><span>${inl(m[2])}</span></div>`;
 else if(m=l.match(/^\+ (.*)/))o+=`<div class=li><span class=sq></span><span>${inl(m[1])}</span></div>`;
 else if(m=l.match(/^[-*] (.*)/))o+=`<div class=li><span class=rd></span><span>${inl(m[1])}</span></div>`;
 else if(l.trim())o+=`<p>${inl(l)}</p>`});return o}
/* ---------- navigation ---------- */
function go(m){S.mode=m;$$('.v').forEach(v=>v.classList.toggle('on',v.id=='v-'+m));$$('header .pill[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go==m));
 if(m=='launch')$('#cnt').textContent=`${S.notes.length} notes · ${S.cards.length} cards on your device`;
 if(m=='notes'){if(!S.notes.length)newNote();if(!cur())S.cur=S.notes[0].id;tabs();load()}
 if(m=='desk'){view();rc()}}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#brand').onclick=()=>go('launch');
$('#th').onclick=()=>{S.theme=S.theme=='dark'?'light':'dark';applyTheme();save()};
function applyTheme(){document.documentElement.dataset.theme=S.theme;$('#th').innerHTML=ic(S.theme=='dark'?'sun':'moon');$('#th').setAttribute('aria-label',S.theme=='dark'?'Switch to light mode':'Switch to dark mode')}
/* ---------- notes ---------- */
const cur=()=>S.notes.find(n=>n.id==S.cur);
function newNote(){const n={id:uid(),t:'',b:'',u:Date.now()};S.notes.push(n);S.cur=n.id;save();return n}
function tabs(){$('#tabs').innerHTML=S.notes.map(n=>`<button class="tab ${n.id==S.cur?'on':''}" data-id="${n.id}">${esc(n.t)||'Untitled'}</button>`).join('')+'<button class="tab" id="nn">+</button>'}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='nn'){newNote();}else S.cur=b.dataset.id;setPv(false);tabs();load()};
function load(){const n=cur();$('#nt').value=n.t;$('#nb').value=n.b}
$('#nt').oninput=e=>{cur().t=e.target.value;cur().u=Date.now();tabs();save()};
$('#nb').oninput=e=>{cur().b=e.target.value;cur().u=Date.now();save()};
function setPv(p){$('#pg').classList.toggle('prev',p);$('#pvb').innerHTML=ic(p?'pen':'eye');$('#pvb').setAttribute('aria-label',p?'Edit':'Preview');$('#pvb').title=p?'Edit':'Preview';if(p)$('#pv').innerHTML=md($('#nb').value)||'<p style="color:var(--mu)">Nothing to preview yet.</p>'}
$('#pvb').onclick=()=>setPv(!$('#pg').classList.contains('prev'));
function closeLm(){$('#lm').hidden=true;$('#lb').setAttribute('aria-expanded','false')}
$('#lb').onclick=e=>{const m=$('#lm');if(!m.hidden)return closeLm();const b=e.currentTarget.getBoundingClientRect();m.style.top=b.bottom+6+'px';m.style.left=Math.max(8,Math.min(b.left,innerWidth-196))+'px';m.hidden=false;$('#lb').setAttribute('aria-expanded','true')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#lm,#lb'))closeLm()});
$$('[data-f]').forEach(b=>b.onclick=()=>{closeLm();setPv(false);const t=$('#nb'),s=t.selectionStart,e=t.selectionEnd,v=t.value,sel=v.slice(s,e),f=b.dataset.f;

const P=new Map();let dr=null,pn=null;

 if(!dr)return;const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;

 else if(dr.c){dr.c.x=dr.ox+dx/v.k;dr.c.y=dr.oy+dy/v.k;dr.el.style.left=dr.c.x+'px';dr.el.style.top=dr.c.y+'px';links()}});
const up=e=>{if(dr&&dr.open&&Math.hypot(e.clientX-dr.sx,e.clientY-dr.sy)<6){S.cur=dr.open;if(cur()){go('notes')}}
